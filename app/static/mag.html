<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>NexaStream MAG TV</title>
  <link rel="stylesheet" href="/static/css/mag.css">
  <script defer src="/static/js/mag.js"></script>
</head>
<body>
  <header><span class="brand">▣ NexaStream</span><span>MAG TV</span></header>
  <main>
    <aside><h1>Live TV &amp; Movies</h1><p>Use ↑ ↓ to choose a title, OK to play, Back to stop.</p><div><button id="liveTab" type="button">Live TV</button><button id="movieTab" type="button">Movies</button></div><div id="message" role="status">Connecting to your MAG device…</div><ul id="channels"></ul><button id="loadMore" type="button" hidden>Load more titles</button></aside>
    <section id="viewer"><div id="playing">Choose a channel to start playing.</div><div id="videoArea"></div></section>
  </main>
</body>
</html>
